<!DOCTYPE html>
<html>
<head>
<title>Dare Royale</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="menu">

<h1>Dare Royale</h1>

<input id="nameInput" placeholder="Nickname">

<select id="gender">
<option value="boy">Dude</option>
<option value="girl">Dudette</option>
</select>

<br><br>

<button onclick="createParty()">Create Party</button>

<br><br>

<input id="codeInput" placeholder="Party Code">

<button onclick="joinParty()">Join Party</button>

</div>

<div id="lobby" class="hidden">

<h2>Lobby</h2>
<h3>Party Code: <span id="lobbyCode"></span></h3>

<h3>Players</h3>
<ul id="playerList"></ul>

<button id="startBtn" class="hidden" onclick="startGame()">Start Game</button>

</div>

<div id="game" class="hidden">

<h2 id="phaseText"></h2>

<h1 id="timer"></h1>

<h3 id="dareCounter"></h3>


<!-- Player List -->
<div id="gamePlayers">
<h3>Players</h3>
<ul id="playerList"></ul>
</div>

<!-- Dare Writing -->
<div id="dareArea" class="hidden">
<input id="dareInput" placeholder="Type a dare">
<button onclick="submitDare()">Submit Dare</button>
<ul id="dareList"></ul>
</div>

<!-- Mini Game Display -->
<div id="miniGameArea"></div>

</div>



<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
